[project]
name = "roast"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
roast = "roast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "PyYAML>=6"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
yaml = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["roast", "roast.*", "examples", "examples.*"]

[tool.setuptools.package-data]
examples = ["*.json", "third_party_template/*.json", "third_party_template/*.md"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
