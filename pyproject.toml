[project]
name = "roast"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["roast", "roast.*", "examples", "examples.*"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
